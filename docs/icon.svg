<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="ccfind">
  <title>ccfind</title>
  <defs>
    <clipPath id="lens"><circle cx="222" cy="218" r="118"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="#1C1B22"/>
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="8"/>
  <!-- handle first: the rim then sits cleanly on top of it -->
  <line x1="334" y1="330" x2="420" y2="416" stroke="#CC785C" stroke-width="46" stroke-linecap="round"/>
  <!-- transcript lines, clipped to the inside of the lens -->
  <g clip-path="url(#lens)">
    <rect x="132" y="172" width="170" height="22" rx="11" fill="#6C6C7A"/>
    <rect x="132" y="208" width="130" height="22" rx="11" fill="#CC785C"/>
    <rect x="132" y="244" width="156" height="22" rx="11" fill="#6C6C7A"/>
  </g>
  <circle cx="222" cy="218" r="132" fill="none" stroke="#F5F1EA" stroke-width="34"/>
</svg>
